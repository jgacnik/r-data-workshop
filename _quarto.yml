project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - setup.qmd
    - materials.qmd
    - R_part*.qmd
  resources:
    - downloads/**

website:
  title: "Data Analysis in R"
  favicon: figures/favicon.png
  description: "A setup guide, interactive slides, and files for a beginner to intermediate Data Analysis in R workshop."
  site-url: "https://jgacnik.github.io/r-data-workshop/"
  repo-url: "https://github.com/jgacnik/r-data-workshop"
  repo-actions: [source, issue]
  search: true
  navbar:
    background: "#ffffff"
    foreground: "#20242a"
    left:
      - href: setup.qmd
        text: Setup
      - href: materials.qmd
        text: Materials
    right:
      - icon: github
        href: "https://github.com/jgacnik/r-data-workshop"
        aria-label: "Workshop repository on GitHub"
  page-footer:
    left: "![Jožef Stefan International Postgraduate School](/figures/MPS_logo_transparent.png){.footer-seal width=112 height=112} Workshop developed and led by Asst. Prof. Jan Gačnik"
    right:
      - text: "Contact Jan Gačnik at jan.gacnik@ijs.si"
        href: "mailto:jan.gacnik@ijs.si"

format:
  html:
    theme: cosmo
    css: site.css
    toc: true
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
